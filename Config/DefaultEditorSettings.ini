[/Script/UnrealEd.EditorPerformanceSettings]
; UEditorPerformanceSettings is config=EditorSettings (not EditorPerProjectUserSettings). Project layer = this file;
; user layer = %LOCALAPPDATA%\UnrealEngine\5.8\Saved\Config\WindowsEditor\EditorSettings.ini (wins if it sets the key).
; The editor throttles to 3 fps and stops rendering when it is not the foreground window (default true). PIE automation from
; Claude sessions and alt-tab to the terminal measured exactly 333 ms/frame because of it (2026-09-21, docs/systems/performance.md).
; A minimized window still throttles regardless of this flag - restore the window before measuring.
bThrottleCPUWhenNotForeground=False
