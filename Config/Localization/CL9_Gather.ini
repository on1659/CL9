; 로컬라이제이션 타깃 CL9 — 수집 (docs/systems/localization.md)
; UnrealEditor-Cmd CL9.uproject -run=GatherText -config="Config/Localization/CL9_Gather.ini"
[CommonSettings]
SourcePath=Content/Localization/CL9
DestinationPath=Content/Localization/CL9
ManifestName=CL9.manifest
ArchiveName=CL9.archive
NativeCulture=ko
CulturesToGenerate=ko
CulturesToGenerate=en
CulturesToGenerate=ja
CulturesToGenerate=zh-Hans

; 소스: LOCTABLE_FROMFILE_GAME이 가리키는 Content/Strings/CL9.csv의 행이 전부 여기서 긁힌다
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/CL9/
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.cpp
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=false

; 에셋: UI·데이터 표. 테이블 참조만 있어야 하므로 여기서 잡히는 항목은 곧 규칙 위반이다
[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/UI/*
IncludePathFilters=Content/Data/*
IncludePathFilters=Content/Input/*
ExcludePathFilters=Content/Localization/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldExcludeDerivedClasses=false
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=CL9.csv
bConflictReport=true
ConflictReportName=CL9_Conflicts.txt
